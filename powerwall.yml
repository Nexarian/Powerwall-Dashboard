services:
    nginx:
      image: nginx:latest
      container_name: nginx
      restart: unless-stopped
      network_mode: host
      volumes:
        # Mount the custom Nginx config (make sure nginx.conf is in the same folder as your docker-compose.yml)
        - type: bind
          source: ./nginx.conf
          target: /etc/nginx/conf.d/default.conf
          read_only: true
      depends_on:
        - grafana
        - pypowerwall

    influxdb:
        image: influxdb:1.8
        container_name: influxdb
        hostname: influxdb
        restart: unless-stopped
        ulimits:
            nofile:
                soft: 65536
                hard: 65536

        network_mode: host
        volumes:
            - type: bind
              source: ./influxdb.conf
              target: /etc/influxdb/influxdb.conf
              read_only: true
            - type: bind
              source: ./influxdb
              target: /var/lib/influxdb
        env_file:
            - influxdb.env
        healthcheck:
            test: curl -f http://influxdb:8086/health || exit 1
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    pypowerwall:
        image: jasonacox/pypowerwall:0.12.6.t200
        container_name: pypowerwall
        hostname: pypowerwall
        restart: unless-stopped
        volumes:
            - type: bind
              source: .auth
              target: /app/.auth
        user: "${PWD_USER:-1000:1000}"
        network_mode: host
        environment:
            - PW_AUTH_PATH_1=.auth
            - PW_AUTH_PATH_2=.auth
        env_file:
            - pypowerwall.env
        healthcheck:
            test: wget --spider -q http://pypowerwall:8675/api/site_info || exit 1
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    telegraf:
        image: telegraf:1.28.2
        container_name: telegraf
        hostname: telegraf
        restart: unless-stopped
        user: "${PWD_USER:-1000:1000}"
        command: [
            "telegraf",
            "--config",
            "/etc/telegraf/telegraf.conf",
            "--config-directory",
            "/etc/telegraf/telegraf.d"
        ]
        network_mode: host
        volumes:
            - type: bind
              source: ./telegraf.conf
              target: /etc/telegraf/telegraf.conf
              read_only: true
            - type: bind
              source: ./telegraf.local
              target: /etc/telegraf/telegraf.d/local.conf
              read_only: true
            - type: bind
              source: ./VERSION
              target: /etc/telegraf/VERSION
              read_only: true
            - type: bind
              source: ./ver.sh
              target: /etc/telegraf/ver.sh
              read_only: true
        depends_on:
            - influxdb
            - pypowerwall
        healthcheck:
            test: pgrep telegraf || exit 1
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    grafana:
        image: grafana/grafana:12.3.1-ubuntu
        container_name: grafana
        hostname: grafana
        restart: unless-stopped
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        user: "${PWD_USER:-1000:1000}"
        network_mode: host
        volumes:
            - type: bind
              source: ./grafana
              target: /var/lib/grafana
        env_file:
            - grafana.env
        depends_on:
            - influxdb
        healthcheck:
            test: curl -f http://grafana:9000/api/health || exit 1
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    weather411:
        image: jasonacox/weather411:0.2.3
        container_name: weather411
        hostname: weather411
        restart: unless-stopped
        user: "${PWD_USER:-1000:1000}"
        network_mode: host
        volumes:
            - type: bind
              source: ./weather
              target: /var/lib/weather
              read_only: true
        environment:
            - WEATHERCONF=/var/lib/weather/weather411.conf
        depends_on:
            - influxdb
        healthcheck:
            test: wget --spider -q http://weather411:8676/stats || exit 1
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    chronograf:
        image: chronograf:1.9
        container_name: chronograf
        hostname: chronograf
        restart: unless-stopped
        user: "${PWD_USER:-1000:1000}"
        network_mode: host
        # Persist Chronograf’s own data (e.g., dashboards, users)
        volumes:
            - type: bind
              source: ./chronograf
              target: /var/lib/chronograf
        depends_on:
            - influxdb
