# WebSocket connection handling
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Upstream definition for Grafana
upstream grafana {
  server localhost:9000;
}

server {
    listen 8095;
    server_name solar.pitstick.net;

    # Common proxy headers
    proxy_set_header Host $host;

    # Group similar routes by service
    location ^~ /api/version8675 {
        proxy_pass http://localhost:8675/version;
    }

    location ^~ /api/version8685 {
        proxy_pass http://localhost:8685/version;
    }

    location ^~ /api8675 {
        proxy_pass http://localhost:8675/;
    }

    # Service on port 8685 - API endpoints
    location ^~ /api8685 {
        proxy_pass http://localhost:8685/;
    }

    # System API endpoints on port 8685
    location ~* ^/api/(troubleshooting/problems|auth/toggle/supported|sitemaster|powerwalls|status|grid_status|site_info|site_info/site_name|networks|customer/registration|system_status/(soe|grid_status|grid_faults)) {
        proxy_pass http://localhost:8685$request_uri;
    }

    location ^~ /aggregates {
        proxy_pass http://localhost:8685/aggregates;
    }

    # Grafana WebSocket connections
    location /api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana;
    }

    # Static files with CORS headers
    location ~* \.(html|css|js|png|otf|svg|woff2)$ {
        add_header Access-Control-Allow-Origin $http_origin always;
        proxy_pass http://localhost:8685;
    }

    # Public directory with CORS
    location ^~ /public/ {
        add_header Access-Control-Allow-Origin *;
        proxy_pass http://grafana;
    }

    # Default route to Grafana
    location / {
        proxy_pass http://grafana;
    }
}
